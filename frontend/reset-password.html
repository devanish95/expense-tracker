<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Expense Tracker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .reset-page {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 46px -26px rgba(0, 0, 0, 0.65);
    }

    .reset-title {
      margin: 0 0 8px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
    }

    .reset-subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    .reset-message {
      margin-top: 14px;
      text-align: center;
      font-size: 0.85rem;
    }

    .reset-message.success {
      color: var(--emerald);
    }

    .reset-message.error {
      color: var(--coral);
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <span class="brand-icon">₹</span>
        <h1 class="brand-title">Expense Tracker</h1>
      </div>
    </div>
  </header>

  <main class="reset-page">
    <div class="reset-card">

      <h2 class="reset-title">Reset Password</h2>

      <p class="reset-subtitle">
        Enter your reset token and choose a new password.
      </p>

      <form id="resetPasswordForm">

        <div class="form-group">
          <label for="resetToken">Reset Token</label>

          <input
            type="text"
            id="resetToken"
            class="form-control"
            placeholder="Enter your reset token"
            required
          >
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            placeholder="Enter new password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm new password"
            minlength="6"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="resetPasswordBtn"
        >
          Reset Password
        </button>

        <p id="resetMessage" class="reset-message"></p>

      </form>

    </div>
  </main>

  <script>
    const API_URL = "/api";

    const resetForm =
      document.getElementById("resetPasswordForm");

    const resetToken =
      document.getElementById("resetToken");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const resetPasswordBtn =
      document.getElementById("resetPasswordBtn");

    const resetMessage =
      document.getElementById("resetMessage");

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const token = resetToken.value.trim();
      const password = newPassword.value;
      const confirm = confirmPassword.value;

      resetMessage.textContent = "";
      resetMessage.className = "reset-message";

      if (password !== confirm) {
        resetMessage.textContent =
          "Passwords do not match.";
        resetMessage.classList.add("error");
        return;
      }

      if (password.length < 6) {
        resetMessage.textContent =
          "Password must be at least 6 characters.";
        resetMessage.classList.add("error");
        return;
      }

      try {
        resetPasswordBtn.disabled = true;
        resetPasswordBtn.textContent = "Resetting...";

        const response = await fetch(
          `${API_URL}/auth/reset-password`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || "Password reset failed."
          );
        }

        resetMessage.textContent =
          data.message ||
          "Password reset successfully.";

        resetMessage.classList.add("success");

        resetForm.reset();

      } catch (error) {
        resetMessage.textContent =
          error.message || "Something went wrong.";

        resetMessage.classList.add("error");

      } finally {
        resetPasswordBtn.disabled = false;
        resetPasswordBtn.textContent = "Reset Password";
      }
    });
  </script>

</body>
</html>
