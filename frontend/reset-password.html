<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password - Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0f19;
      --surface: rgba(20, 26, 39, 0.88);
      --surface-soft: rgba(255, 255, 255, 0.035);
      --surface-hover: rgba(255, 255, 255, 0.055);
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f3f7fb;
      --text-secondary: #96a2b6;
      --accent: #22d3ee;
      --accent-blue: #3b82f6;
      --success: #34d399;
      --error: #fb7185;
      --header-bg: rgba(10, 15, 25, 0.76);
      --shadow: rgba(0, 0, 0, 0.58);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 10% 12%,
          rgba(34, 211, 238, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 91% 82%,
          rgba(16, 185, 129, 0.07),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #080c14 0%,
          #0b101a 52%,
          #080d16 100%
        );
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      width: 620px;
      height: 620px;
      top: -280px;
      left: -220px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(34, 211, 238, 0.13),
        transparent 70%
      );
      filter: blur(55px);
      pointer-events: none;
      animation: glowMove 16s ease-in-out infinite;
    }

    body::after {
      content: "";
      position: fixed;
      width: 650px;
      height: 650px;
      right: -280px;
      bottom: -300px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(16, 185, 129, 0.09),
        transparent 70%
      );
      filter: blur(65px);
      pointer-events: none;
      animation: glowMoveReverse 20s ease-in-out infinite;
    }

    @keyframes glowMove {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(28px, 20px);
      }
    }

    @keyframes glowMoveReverse {
      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-24px, -18px);
      }
    }

    .currency-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .currency-background span {
      position: absolute;
      display: block;
      color: rgba(34, 211, 238, 0.18);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: clamp(3rem, 5vw, 5.7rem);
      font-weight: 600;
      line-height: 1;
      user-select: none;
      will-change: transform, opacity;
      text-shadow:
        0 0 22px rgba(34, 211, 238, 0.07),
        0 0 42px rgba(34, 211, 238, 0.04);
      animation: currencyFloat 17s ease-in-out infinite;
    }

    .currency-background span:nth-child(1) {
      left: 7%;
      top: 15%;
      animation-delay: -2s;
      animation-duration: 17s;
    }

    .currency-background span:nth-child(2) {
      left: 25%;
      top: 72%;
      animation-delay: -7s;
      animation-duration: 20s;
    }

    .currency-background span:nth-child(3) {
      left: 44%;
      top: 12%;
      animation-delay: -4s;
      animation-duration: 18s;
    }

    .currency-background span:nth-child(4) {
      left: 67%;
      top: 74%;
      animation-delay: -10s;
      animation-duration: 22s;
    }

    .currency-background span:nth-child(5) {
      left: 87%;
      top: 18%;
      animation-delay: -6s;
      animation-duration: 19s;
    }

    .currency-background span:nth-child(6) {
      left: 12%;
      top: 53%;
      animation-delay: -11s;
      animation-duration: 21s;
    }

    .currency-background span:nth-child(7) {
      left: 34%;
      top: 38%;
      animation-delay: -3s;
      animation-duration: 17s;
    }

    .currency-background span:nth-child(8) {
      left: 57%;
      top: 86%;
      animation-delay: -8s;
      animation-duration: 23s;
    }

    .currency-background span:nth-child(9) {
      left: 78%;
      top: 47%;
      animation-delay: -5s;
      animation-duration: 20s;
    }

    .currency-background span:nth-child(10) {
      left: 93%;
      top: 82%;
      animation-delay: -12s;
      animation-duration: 22s;
    }

    @keyframes currencyFloat {
      0%,
      100% {
        transform:
          translate3d(0, 16px, 0)
          rotate(-4deg)
          scale(0.95);
        opacity: 0.18;
      }

      25% {
        opacity: 0.28;
      }

      50% {
        transform:
          translate3d(24px, -30px, 0)
          rotate(6deg)
          scale(1.06);
        opacity: 0.42;
      }

      75% {
        opacity: 0.25;
      }
    }

    .app-header {
      position: relative;
      z-index: 20;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 12px 34px -28px rgba(0, 0, 0, 0.75);
    }

    .header-content {
      width: 100%;
      max-width: 1180px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(34, 211, 238, 0.36);
      border-radius: 12px;
      background:
        linear-gradient(
          145deg,
          rgba(34, 211, 238, 0.15),
          rgba(59, 130, 246, 0.08)
        );
      color: var(--accent);
      font-family: "Space Grotesk", sans-serif;
      font-size: 21px;
      font-weight: 700;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.025) inset,
        0 8px 22px -12px rgba(34, 211, 238, 0.40);
    }

    .brand-title {
      margin: 0;
      color: var(--text);
      font-family: "Space Grotesk", sans-serif;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .theme-toggle-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 26px;
      z-index: 50;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      box-shadow:
        0 10px 24px -16px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition:
        background 200ms ease,
        border-color 200ms ease,
        transform 180ms ease,
        box-shadow 200ms ease;
    }

    .theme-toggle:hover {
      transform: scale(1.06);
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(34, 211, 238, 0.34);
      box-shadow:
        0 12px 28px -16px rgba(0, 0, 0, 0.80),
        0 0 25px -16px rgba(34, 211, 238, 0.48);
    }

    .theme-toggle-input:focus-visible + .theme-toggle {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .theme-icon {
      position: absolute;
      font-size: 18px;
      line-height: 1;
      transition:
        opacity 180ms ease,
        transform 220ms ease;
    }

    .theme-icon-sun {
      opacity: 0;
      transform: rotate(-25deg) scale(0.72);
    }

    .theme-icon-moon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .reset-page {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 38px 20px 45px;
    }

    .reset-card {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 38px 36px 26px;
      background:
        linear-gradient(
          145deg,
          rgba(23, 30, 45, 0.94),
          rgba(16, 22, 34, 0.94)
        );
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 22px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 34px 75px -36px var(--shadow),
        0 0 75px -44px rgba(34, 211, 238, 0.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardEnter 550ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .reset-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 14%;
      right: 14%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(34, 211, 238, 0.75),
        transparent
      );
    }

    .reset-card::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      left: -105px;
      bottom: -115px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(34, 211, 238, 0.08),
        transparent 70%
      );
      pointer-events: none;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .reset-title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--text);
      font-family: "Space Grotesk", sans-serif;
      font-size: 31px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .reset-subtitle {
      max-width: 350px;
      margin: 0 auto 30px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #9ca8ba;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
      transition:
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .form-control:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .form-control:focus {
      border-color: rgba(34, 211, 238, 0.52);
      background: rgba(34, 211, 238, 0.045);
      box-shadow:
        0 0 0 3px rgba(34, 211, 238, 0.11),
        0 12px 25px -20px rgba(34, 211, 238, 0.38);
      transform: translateY(-1px);
    }

    .form-control::placeholder {
      color: #697487;
    }

    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          #3b82f6 0%,
          #22d3ee 100%
        );
      color: #04131b;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.30) inset,
        0 16px 30px -13px rgba(34, 211, 238, 0.42);
      transition:
        transform 180ms ease,
        box-shadow 220ms ease,
        filter 180ms ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 18%,
        rgba(255, 255, 255, 0.22) 50%,
        transparent 82%
      );
      transform: translateX(-115%);
      transition: transform 650ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.34) inset,
        0 19px 34px -13px rgba(34, 211, 238, 0.50);
    }

    .btn:hover::before {
      transform: translateX(115%);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.62;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .message {
      min-height: 18px;
      margin: 10px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      color: var(--success);
    }

    .message.error {
      color: var(--error);
    }

    .back-login {
      display: block;
      margin-top: 12px;
      text-align: center;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition:
        color 180ms ease,
        transform 180ms ease;
    }

    .back-login:hover {
      color: #67e8f9;
      transform: translateY(-1px);
    }

    body:has(#themeToggleInput:checked) {
      --bg: #dce5ed;
      --surface: rgba(255, 255, 255, 0.90);
      --surface-soft: rgba(15, 23, 42, 0.035);
      --surface-hover: rgba(15, 23, 42, 0.055);
      --border: rgba(15, 23, 42, 0.10);
      --border-strong: rgba(15, 23, 42, 0.17);
      --text: #162133;
      --text-secondary: #63738a;
      --header-bg: rgba(247, 250, 252, 0.86);
      --shadow: rgba(15, 23, 42, 0.24);

      background:
        radial-gradient(
          circle at 9% 10%,
          rgba(56, 189, 248, 0.22),
          transparent 29%
        ),
        radial-gradient(
          circle at 91% 84%,
          rgba(45, 212, 191, 0.15),
          transparent 31%
        ),
        linear-gradient(
          135deg,
          #e9eff4 0%,
          #dde7ee 54%,
          #d5e0e8 100%
        );
      color-scheme: light;
    }

    body:has(#themeToggleInput:checked)::before {
      background:
        radial-gradient(
          circle,
          rgba(56, 189, 248, 0.10),
          transparent 70%
        );
    }

    body:has(#themeToggleInput:checked)::after {
      background:
        radial-gradient(
          circle,
          rgba(45, 212, 191, 0.08),
          transparent 70%
        );
    }

    body:has(#themeToggleInput:checked) .currency-background span {
      color: rgba(56, 88, 110, 0.20);
      text-shadow: none;
    }

    body:has(#themeToggleInput:checked) .app-header {
      border-bottom-color: rgba(15, 23, 42, 0.08);
      box-shadow:
        0 10px 28px -22px rgba(15, 23, 42, 0.25);
    }

    body:has(#themeToggleInput:checked) .brand-icon {
      background:
        linear-gradient(
          145deg,
          rgba(56, 189, 248, 0.12),
          rgba(59, 130, 246, 0.06)
        );
      border-color: rgba(8, 145, 178, 0.28);
    }

    body:has(#themeToggleInput:checked) .reset-card {
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.94),
          rgba(247, 250, 252, 0.93)
        );
      border-color: rgba(15, 23, 42, 0.10);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 1) inset,
        0 34px 72px -38px rgba(15, 23, 42, 0.28),
        0 0 65px -42px rgba(14, 165, 233, 0.22);
    }

    body:has(#themeToggleInput:checked) .reset-card::before {
      background: linear-gradient(
        90deg,
        transparent,
        rgba(8, 145, 178, 0.52),
        transparent
      );
    }

    body:has(#themeToggleInput:checked) .reset-title {
      color: #162133;
    }

    body:has(#themeToggleInput:checked) .reset-subtitle {
      color: #61728a;
    }

    body:has(#themeToggleInput:checked) .form-group label {
      color: #5e6e84;
    }

    body:has(#themeToggleInput:checked) .form-control {
      background: rgba(248, 250, 252, 0.95);
      border-color: rgba(15, 23, 42, 0.11);
      color: #172033;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    body:has(#themeToggleInput:checked) .form-control:hover {
      background: #ffffff;
      border-color: rgba(15, 23, 42, 0.16);
    }

    body:has(#themeToggleInput:checked) .form-control:focus {
      background: #ffffff;
      border-color: rgba(8, 145, 178, 0.42);
      box-shadow:
        0 0 0 3px rgba(34, 211, 238, 0.09),
        0 12px 25px -20px rgba(8, 145, 178, 0.24);
    }

    body:has(#themeToggleInput:checked) .form-control::placeholder {
      color: rgba(100, 116, 139, 0.62);
    }

    body:has(#themeToggleInput:checked) .theme-toggle {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(15, 23, 42, 0.10);
      color: #172033;
      box-shadow:
        0 10px 25px -17px rgba(15, 23, 42, 0.28);
    }

    body:has(#themeToggleInput:checked) .theme-toggle:hover {
      background: #ffffff;
      border-color: rgba(8, 145, 178, 0.28);
    }

    body:has(#themeToggleInput:checked) .theme-icon-sun {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    body:has(#themeToggleInput:checked) .theme-icon-moon {
      opacity: 0;
      transform: rotate(25deg) scale(0.72);
    }

    @media (max-width: 640px) {
      .app-header {
        height: 68px;
      }

      .header-content {
        padding: 0 58px 0 16px;
      }

      .brand {
        gap: 8px;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        font-size: 18px;
      }

      .brand-title {
        font-size: 18px;
      }

      .theme-toggle {
        top: 14px;
        right: 14px;
        width: 38px;
        height: 38px;
      }

      .reset-page {
        min-height: calc(100vh - 68px);
        padding: 26px 16px 38px;
      }

      .reset-card {
        padding: 28px 22px 22px;
        border-radius: 18px;
      }

      .reset-title {
        font-size: 27px;
      }

      .reset-subtitle {
        font-size: 14px;
        margin-bottom: 26px;
      }

      .currency-background span {
        font-size: clamp(2.6rem, 12vw, 4rem);
      }
    }

    @media (max-width: 390px) {
      .brand-title {
        font-size: 17px;
      }

      .reset-card {
        padding: 26px 18px 20px;
      }

      .reset-title {
        font-size: 25px;
      }

      .form-control,
      .btn {
        height: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="currency-background" aria-hidden="true">
    <span>₹</span>
    <span>$</span>
    <span>€</span>
    <span>£</span>
    <span>¥</span>
    <span>₹</span>
    <span>$</span>
    <span>€</span>
    <span>£</span>
    <span>¥</span>
  </div>

  <header class="app-header">

    <div class="header-content">

      <div class="brand">

        <span class="brand-icon">
          ₹
        </span>

        <h1 class="brand-title">
          Expense Tracker
        </h1>

      </div>

    </div>

    <input
      type="checkbox"
      id="themeToggleInput"
      class="theme-toggle-input"
    >

    <label
      for="themeToggleInput"
      class="theme-toggle"
      aria-label="Toggle theme"
      title="Toggle theme"
    >
      <span class="theme-icon theme-icon-sun">☀</span>
      <span class="theme-icon theme-icon-moon">☾</span>
    </label>

  </header>

  <main class="reset-page">

    <div class="reset-card">

      <h2 class="reset-title">
        Reset Password
      </h2>

      <p class="reset-subtitle">
        Enter your email or user ID and choose a new password.
      </p>

      <form id="resetPasswordForm">

        <div class="form-group">

          <label for="resetEmail">
            Email / User ID
          </label>

          <input
            type="text"
            id="resetEmail"
            class="form-control"
            placeholder="Enter your email or user ID"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            placeholder="Enter new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <button
          type="submit"
          class="btn"
          id="resetPasswordBtn"
        >
          Reset Password
        </button>

        <p
          id="resetMessage"
          class="message"
          aria-live="polite"
        ></p>

        <a
          href="/"
          class="back-login"
        >
          Back to Login
        </a>

      </form>

    </div>

  </main>

  <script>
    const API_URL = "/api";

    const resetForm =
      document.getElementById("resetPasswordForm");

    const resetEmail =
      document.getElementById("resetEmail");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const resetPasswordBtn =
      document.getElementById("resetPasswordBtn");

    const resetMessage =
      document.getElementById("resetMessage");

    function showMessage(message, type) {
      resetMessage.textContent = message;
      resetMessage.className = "message";
      resetMessage.classList.add(type);
    }

    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const identifier =
          resetEmail.value.trim();

        const password =
          newPassword.value;

        const confirm =
          confirmPassword.value;

        resetMessage.textContent = "";
        resetMessage.className = "message";

        if (!identifier) {
          showMessage(
            "Please enter your email or user ID.",
            "error"
          );
          return;
        }

        if (password.length < 6) {
          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );
          return;
        }

        if (password !== confirm) {
          showMessage(
            "Passwords do not match.",
            "error"
          );
          return;
        }

        try {

          resetPasswordBtn.disabled = true;

          resetPasswordBtn.textContent =
            "Resetting...";

          const response =
            await fetch(
              `${API_URL}/auth/reset-password`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  identifier,
                  password
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Password reset failed."
            );
          }

          showMessage(
            data.message ||
            "Password reset successfully. You can now log in.",
            "success"
          );

          resetForm.reset();

          setTimeout(() => {
            window.location.href = "/";
          }, 1500);

        } catch (error) {

          showMessage(
            error.message ||
            "Something went wrong.",
            "error"
          );

        } finally {

          resetPasswordBtn.disabled = false;

          resetPasswordBtn.textContent =
            "Reset Password";
        }
      }
    );
  </script>

</body>

</html>
