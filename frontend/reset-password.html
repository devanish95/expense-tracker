<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password - Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #0b101a;
      color: #f2f5fa;
      font-family: Arial, sans-serif;
    }

    .app-header {
      height: 74px;
      border-bottom: 1px solid #202938;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-content {
      width: 100%;
      max-width: 1100px;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #087fa3;
      border-radius: 12px;
      background: #102433;
      color: #22d3ee;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-title {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .reset-page {
      min-height: calc(100vh - 74px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: #141925;
      border: 1px solid #293243;
      border-radius: 18px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }

    .reset-title {
      margin: 0 0 10px;
      text-align: center;
      font-size: 29px;
      font-weight: 700;
    }

    .reset-subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #9099aa;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #98a2b4;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #303949;
      border-radius: 12px;
      outline: none;
      background: #1c212c;
      color: #f2f5fa;
      font-size: 16px;
    }

    .form-control::placeholder {
      color: #697285;
    }

    .form-control:focus {
      border-color: #22bde0;
      box-shadow: 0 0 0 3px rgba(34, 189, 224, 0.12);
    }

    .btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #3b82f6,
        #22cce8
      );
      color: #061018;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(34, 204, 232, 0.18);
      margin-top: 4px;
    }

    .btn:hover {
      filter: brightness(1.05);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .secondary-btn {
      margin-top: 12px;
      background: #222a38;
      color: #dbe4ef;
      box-shadow: none;
      border: 1px solid #343f51;
    }

    .message {
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      color: #34d399;
    }

    .message.error {
      color: #fb7185;
    }

    .token-status {
      margin-bottom: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #102c25;
      border: 1px solid #1c6a59;
      color: #67e8b1;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }

    .token-status.show {
      display: block;
    }

    .back-login {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #22d3ee;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-login:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 30px 22px;
      }

      .reset-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="app-header">

    <div class="header-content">

      <div class="brand">

        <span class="brand-icon">
          ₹
        </span>

        <h1 class="brand-title">
          Expense Tracker
        </h1>

      </div>

    </div>

  </header>

  <main class="reset-page">

    <div class="reset-card">

      <h2 class="reset-title">
        Reset Password
      </h2>

      <p class="reset-subtitle">
        Enter your email or user ID and choose a new password.
      </p>

      <div
        id="tokenStatus"
        class="token-status"
      >
        Password reset link verified.
        You can now choose your new password.
      </div>

      <form id="resetPasswordForm">

        <!-- EMAIL / USER ID -->

        <div class="form-group">

          <label for="resetEmail">
            Email / User ID
          </label>

          <input
            type="text"
            id="resetEmail"
            class="form-control"
            placeholder="Enter your email or user ID"
            autocomplete="username"
            required
          >

        </div>

        <!-- NEW PASSWORD -->

        <div class="form-group">

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            placeholder="Enter new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <!-- RESET -->

        <button
          type="submit"
          class="btn"
          id="resetPasswordBtn"
        >
          Reset Password
        </button>

        <!-- REQUEST RESET LINK -->

        <button
          type="button"
          class="btn secondary-btn"
          id="sendResetLinkBtn"
        >
          Send Reset Link
        </button>

        <p
          id="resetMessage"
          class="message"
          aria-live="polite"
        ></p>

        <a
          href="/"
          class="back-login"
        >
          Back to Login
        </a>

      </form>

    </div>

  </main>

  <script>
    const API_URL = "/api";

    const resetForm =
      document.getElementById(
        "resetPasswordForm"
      );

    const resetEmail =
      document.getElementById(
        "resetEmail"
      );

    const newPassword =
      document.getElementById(
        "newPassword"
      );

    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      );

    const resetPasswordBtn =
      document.getElementById(
        "resetPasswordBtn"
      );

    const sendResetLinkBtn =
      document.getElementById(
        "sendResetLinkBtn"
      );

    const resetMessage =
      document.getElementById(
        "resetMessage"
      );

    const tokenStatus =
      document.getElementById(
        "tokenStatus"
      );

    const urlParams =
      new URLSearchParams(
        window.location.search
      );

    const resetToken =
      urlParams.get("token");

    if (resetToken) {
      tokenStatus.classList.add(
        "show"
      );

      sendResetLinkBtn.style.display =
        "none";
    }

    function showMessage(
      message,
      type
    ) {
      resetMessage.textContent =
        message;

      resetMessage.className =
        "message";

      resetMessage.classList.add(
        type
      );
    }

    async function sendResetLink() {
      const email =
        resetEmail.value.trim();

      if (!email) {
        showMessage(
          "Please enter your email or user ID.",
          "error"
        );

        resetEmail.focus();

        return;
      }

      try {
        sendResetLinkBtn.disabled =
          true;

        sendResetLinkBtn.textContent =
          "Sending...";

        const response =
          await fetch(
            `${API_URL}/auth/forgot-password`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                email
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Unable to send reset link."
          );
        }

        showMessage(
          data.message ||
          "If an account exists with this email, a password reset link has been sent.",
          "success"
        );

      } catch (error) {
        showMessage(
          error.message ||
          "Something went wrong.",
          "error"
        );

      } finally {
        sendResetLinkBtn.disabled =
          false;

        sendResetLinkBtn.textContent =
          "Send Reset Link";
      }
    }

    async function resetPassword() {
      const email =
        resetEmail.value.trim();

      const password =
        newPassword.value;

      const confirm =
        confirmPassword.value;

      if (!resetToken) {
        showMessage(
          "Please send the reset link to your email first, then open the reset link from your email.",
          "error"
        );

        return;
      }

      if (!email) {
        showMessage(
          "Please enter your email or user ID.",
          "error"
        );

        return;
      }

      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }

      if (password !== confirm) {
        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }

      try {
        resetPasswordBtn.disabled =
          true;

        resetPasswordBtn.textContent =
          "Resetting...";

        const response =
          await fetch(
            `${API_URL}/auth/reset-password`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                token: resetToken,
                email,
                password
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Password reset failed."
          );
        }

        showMessage(
          data.message ||
          "Password reset successfully. You can now log in.",
          "success"
        );

        resetForm.reset();

        setTimeout(() => {
          window.location.href = "/";
        }, 1500);

      } catch (error) {
        showMessage(
          error.message ||
          "Something went wrong.",
          "error"
        );

      } finally {
        resetPasswordBtn.disabled =
          false;

        resetPasswordBtn.textContent =
          "Reset Password";
      }
    }

    sendResetLinkBtn.addEventListener(
      "click",
      sendResetLink
    );

    resetForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();
        await resetPassword();
      }
    );
  </script>

</body>
</html>
