<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password - Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #0b101a;
      color: #f2f5fa;
      font-family: Arial, sans-serif;
    }

    .app-header {
      height: 74px;
      border-bottom: 1px solid #202938;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-content {
      width: 100%;
      max-width: 1100px;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #087fa3;
      border-radius: 12px;
      background: #102433;
      color: #22d3ee;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-title {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .reset-page {
      min-height: calc(100vh - 74px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: #141925;
      border: 1px solid #293243;
      border-radius: 18px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }

    .reset-title {
      margin: 0 0 10px;
      text-align: center;
      font-size: 29px;
      font-weight: 700;
    }

    .reset-subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #9099aa;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #98a2b4;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #303949;
      border-radius: 12px;
      outline: none;
      background: #1c212c;
      color: #f2f5fa;
      font-size: 16px;
    }

    .form-control::placeholder {
      color: #697285;
    }

    .form-control:focus {
      border-color: #22bde0;
      box-shadow: 0 0 0 3px rgba(34, 189, 224, 0.12);
    }

    .btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #3b82f6,
        #22cce8
      );
      color: #061018;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(34, 204, 232, 0.18);
    }

    .btn:hover {
      filter: brightness(1.05);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      color: #34d399;
    }

    .message.error {
      color: #fb7185;
    }

    .back-login {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #22d3ee;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-login:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 30px 22px;
      }

      .reset-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="app-header">

    <div class="header-content">

      <div class="brand">

        <span class="brand-icon">
          ₹
        </span>

        <h1 class="brand-title">
          Expense Tracker
        </h1>

      </div>

    </div>

  </header>

  <main class="reset-page">

    <div class="reset-card">

      <h2 class="reset-title">
        Reset Password
      </h2>

      <p class="reset-subtitle">
        Enter your email or user ID and choose a new password.
      </p>

      <form id="resetPasswordForm">

        <div class="form-group">

          <label for="resetEmail">
            Email / User ID
          </label>

          <input
            type="text"
            id="resetEmail"
            class="form-control"
            placeholder="Enter your email or user ID"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            placeholder="Enter new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <button
          type="submit"
          class="btn"
          id="resetPasswordBtn"
        >
          Reset Password
        </button>

        <p
          id="resetMessage"
          class="message"
          aria-live="polite"
        ></p>

        <a
          href="/"
          class="back-login"
        >
          Back to Login
        </a>

      </form>

    </div>

  </main>

  <script>
    const API_URL = "/api";

    const resetForm =
      document.getElementById("resetPasswordForm");

    const resetEmail =
      document.getElementById("resetEmail");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const resetPasswordBtn =
      document.getElementById("resetPasswordBtn");

    const resetMessage =
      document.getElementById("resetMessage");

    function showMessage(message, type) {
      resetMessage.textContent = message;
      resetMessage.className = "message";
      resetMessage.classList.add(type);
    }

    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const identifier =
          resetEmail.value.trim();

        const password =
          newPassword.value;

        const confirm =
          confirmPassword.value;

        resetMessage.textContent = "";
        resetMessage.className = "message";

        if (!identifier) {
          showMessage(
            "Please enter your email or user ID.",
            "error"
          );
          return;
        }

        if (password.length < 6) {
          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );
          return;
        }

        if (password !== confirm) {
          showMessage(
            "Passwords do not match.",
            "error"
          );
          return;
        }

        try {

          resetPasswordBtn.disabled = true;

          resetPasswordBtn.textContent =
            "Resetting...";

          const response =
            await fetch(
              `${API_URL}/auth/reset-password`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  identifier,
                  password
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Password reset failed."
            );
          }

          showMessage(
            data.message ||
            "Password reset successfully. You can now log in.",
            "success"
          );

          resetForm.reset();

          setTimeout(() => {
            window.location.href = "/";
          }, 1500);

        } catch (error) {

          showMessage(
            error.message ||
            "Something went wrong.",
            "error"
          );

        } finally {

          resetPasswordBtn.disabled = false;

          resetPasswordBtn.textContent =
            "Reset Password";
        }
      }
    );
  </script>

</body>

</html>
