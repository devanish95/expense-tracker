<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Expense Tracker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .reset-page {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 46px -26px rgba(0, 0, 0, 0.65);
    }

    .reset-title {
      margin: 0 0 8px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .reset-subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .reset-message {
      margin-top: 14px;
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .reset-message.success {
      color: var(--emerald);
    }

    .reset-message.error {
      color: var(--coral);
    }

    .back-login {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: var(--accent-cyan);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    .back-login:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <span class="brand-icon">₹</span>
        <h1 class="brand-title">Expense Tracker</h1>
      </div>
    </div>
  </header>

  <main class="reset-page">
    <div class="reset-card">

      <h2 class="reset-title">Reset Password</h2>

      <p class="reset-subtitle">
        Enter your email or user ID and choose a new password.
      </p>

      <form id="resetPasswordForm">

        <!-- EMAIL / USER ID -->
        <div class="form-group">
          <label for="resetEmail">Email / User ID</label>

          <input
            type="email"
            id="resetEmail"
            class="form-control"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
        </div>

        <!-- NEW PASSWORD -->
        <div class="form-group">
          <label for="newPassword">New Password</label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            placeholder="Enter new password"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm new password"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <!-- RESET BUTTON -->
        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="resetPasswordBtn"
        >
          Reset Password
        </button>

        <!-- MESSAGE -->
        <p
          id="resetMessage"
          class="reset-message"
          aria-live="polite"
        ></p>

        <!-- BACK TO LOGIN -->
        <a
          href="/"
          class="back-login"
        >
          Back to Login
        </a>

      </form>

    </div>
  </main>

  <script>
    const API_URL = "/api";

    const resetForm =
      document.getElementById("resetPasswordForm");

    const resetEmail =
      document.getElementById("resetEmail");

    const newPassword =
      document.getElementById("newPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const resetPasswordBtn =
      document.getElementById("resetPasswordBtn");

    const resetMessage =
      document.getElementById("resetMessage");


    // Read reset token from URL
    //
    // Example:
    // /reset-password.html?token=abc123
    //
    const urlParams =
      new URLSearchParams(window.location.search);

    const resetToken =
      urlParams.get("token");


    // Check reset token
    if (!resetToken) {

      resetMessage.textContent =
        "Invalid or missing password reset link.";

      resetMessage.className =
        "reset-message error";

      resetPasswordBtn.disabled = true;
    }


    // Submit reset form
    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        // Token check
        if (!resetToken) {

          resetMessage.textContent =
            "Invalid or missing password reset link.";

          resetMessage.className =
            "reset-message error";

          return;
        }


        const email =
          resetEmail.value.trim();

        const password =
          newPassword.value;

        const confirm =
          confirmPassword.value;


        // Clear previous message
        resetMessage.textContent = "";

        resetMessage.className =
          "reset-message";


        // Email validation
        if (!email) {

          resetMessage.textContent =
            "Please enter your email address.";

          resetMessage.classList.add("error");

          return;
        }


        // Password length validation
        if (password.length < 6) {

          resetMessage.textContent =
            "Password must be at least 6 characters.";

          resetMessage.classList.add("error");

          return;
        }


        // Password match validation
        if (password !== confirm) {

          resetMessage.textContent =
            "Passwords do not match.";

          resetMessage.classList.add("error");

          return;
        }


        try {

          resetPasswordBtn.disabled = true;

          resetPasswordBtn.textContent =
            "Resetting...";


          const response =
            await fetch(
              `${API_URL}/auth/reset-password`,
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({

                  // Reset token from URL
                  token: resetToken,

                  // Email entered by user
                  email: email,

                  // New password
                  password: password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Password reset failed."
            );
          }


          resetMessage.textContent =
            data.message ||
            "Password reset successfully.";

          resetMessage.className =
            "reset-message success";


          // Clear form after successful reset
          resetForm.reset();


          // Enable button again
          resetPasswordBtn.disabled = false;

        } catch (error) {

          resetMessage.textContent =
            error.message ||
            "Something went wrong.";

          resetMessage.className =
            "reset-message error";

        } finally {

          resetPasswordBtn.disabled = false;

          resetPasswordBtn.textContent =
            "Reset Password";
        }
      }
    );
  </script>

</body>
</html>
