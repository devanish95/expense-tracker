<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Forgot Password - Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #0b101a;
      color: #f2f5fa;
      font-family: Arial, sans-serif;
    }

    .app-header {
      height: 74px;
      border-bottom: 1px solid #202938;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-content {
      width: 100%;
      max-width: 1100px;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #087fa3;
      border-radius: 12px;
      background: #102433;
      color: #22d3ee;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-title {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
    }

    .forgot-page {
      min-height: calc(100vh - 74px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .forgot-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: #141925;
      border: 1px solid #293243;
      border-radius: 18px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
    }

    .forgot-title {
      margin: 0 0 10px;
      text-align: center;
      font-size: 29px;
      font-weight: 700;
    }

    .forgot-subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #9099aa;
      font-size: 15px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #98a2b4;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #303949;
      border-radius: 12px;
      outline: none;
      background: #1c212c;
      color: #f2f5fa;
      font-size: 16px;
    }

    .form-control::placeholder {
      color: #697285;
    }

    .form-control:focus {
      border-color: #22bde0;
      box-shadow: 0 0 0 3px rgba(34, 189, 224, 0.12);
    }

    .btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #3b82f6,
        #22cce8
      );
      color: #061018;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(34, 204, 232, 0.18);
    }

    .btn:hover {
      filter: brightness(1.05);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      margin: 16px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      color: #34d399;
    }

    .message.error {
      color: #fb7185;
    }

    .back-login {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #22d3ee;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-login:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .forgot-card {
        padding: 30px 22px;
      }

      .forgot-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="header-content">

      <div class="brand">
        <span class="brand-icon">₹</span>

        <h1 class="brand-title">
          Expense Tracker
        </h1>
      </div>

    </div>
  </header>

  <main class="forgot-page">

    <div class="forgot-card">

      <h2 class="forgot-title">
        Forgot Password
      </h2>

      <p class="forgot-subtitle">
        Enter your registered email address and
        we'll send you a password reset link.
      </p>

      <form id="forgotPasswordForm">

        <div class="form-group">

          <label for="forgotEmail">
            Email Address
          </label>

          <input
            type="email"
            id="forgotEmail"
            class="form-control"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >

        </div>

        <button
          type="submit"
          class="btn"
          id="forgotPasswordBtn"
        >
          Send Reset Link
        </button>

        <p
          id="forgotMessage"
          class="message"
          aria-live="polite"
        ></p>

        <a
          href="/"
          class="back-login"
        >
          Back to Login
        </a>

      </form>

    </div>

  </main>

  <script>
    const API_URL = "/api";

    const forgotForm =
      document.getElementById("forgotPasswordForm");

    const forgotEmail =
      document.getElementById("forgotEmail");

    const forgotPasswordBtn =
      document.getElementById("forgotPasswordBtn");

    const forgotMessage =
      document.getElementById("forgotMessage");

    forgotForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const email =
          forgotEmail.value.trim();

        forgotMessage.textContent = "";
        forgotMessage.className = "message";

        if (!email) {
          forgotMessage.textContent =
            "Please enter your email address.";

          forgotMessage.classList.add("error");

          return;
        }

        try {
          forgotPasswordBtn.disabled = true;

          forgotPasswordBtn.textContent =
            "Sending...";

          const response = await fetch(
            `${API_URL}/auth/forgot-password`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                email
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Unable to send reset link."
            );
          }

          forgotMessage.textContent =
            data.message ||
            "If an account exists with this email, a password reset link has been sent.";

          forgotMessage.classList.add(
            "success"
          );

          forgotForm.reset();

        } catch (error) {
          forgotMessage.textContent =
            error.message ||
            "Something went wrong.";

          forgotMessage.classList.add(
            "error"
          );

        } finally {
          forgotPasswordBtn.disabled = false;

          forgotPasswordBtn.textContent =
            "Send Reset Link";
        }
      }
    );
  </script>

</body>
</html>
